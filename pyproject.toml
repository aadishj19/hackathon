[project]
name = "hackathon"
version = "0.1.0"
description = "Team repo for the KBC track, Leuven, 30 September 2026"
requires-python = ">=3.12"
dependencies = [
    "anthropic[vertex]",
    "openai",
    "google-genai",
    "elevenlabs",
    "duckdb",
    "pandas",
    "pyarrow",
    "openpyxl",
    "xlrd",
    "pydantic",
    "python-dotenv",
    "streamlit",
    "plotly",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hack"]

[tool.ruff]
line-length = 100
